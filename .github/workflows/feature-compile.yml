name: Feature Compile Check

on:
  push:
    branches:
      - feature/factory-tactical-map
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile and test
        run: ./gradlew compileJava test --stacktrace --no-daemon
