name: Release

# 无 PAT 环境的 Release 自动化：
#   - 推送 main：为"最新 tag 尚无 Release"时自动补建（本次 v1.5.3 即此路径）
#   - 推送 v* tag：自动为该 tag 建 Release
#   - workflow_dispatch：Actions 页面可手动触发
# 幂等：Release 已存在则跳过。建好后推 release-<tag> 标记 tag 作为发布记录。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（完整历史 + tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析目标版本 tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0 --match 'v*')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "目标 tag：${TAG}"

      - name: Release 状态检查（资产指纹对比：jar/描述有更新则删除重建）
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${{ steps.tag.outputs.version }}"
          JAR="releases/drag-inventory-1.21.1-neoforge-${VER}.jar"
          NOTES="releases/RELEASE_NOTES-${TAG}.md"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} 不存在，将创建。"
            exit 0
          fi
          # 对比仓库 jar 的 SHA256 与 Release 附件 digest（重发场景：修复后的新 jar）
          LOCAL_SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          JAR_NAME=$(basename "$JAR")
          REMOTE_DIGEST=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$JAR_NAME\") | .digest" || true)
          REMOTE_SHA=${REMOTE_DIGEST#sha256:}
          SAME_JAR=false
          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" == "$LOCAL_SHA" ]]; then SAME_JAR=true; fi
          # 对比描述与仓库 notes 文件（描述更新场景）
          SAME_NOTES=false
          if [[ -f "$NOTES" ]]; then
            REMOTE_BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body || true)
            if [[ "$REMOTE_BODY" == "$(cat "$NOTES")" ]]; then SAME_NOTES=true; fi
          else
            SAME_NOTES=true  # 无 notes 文件则不参与对比
          fi
          if [[ "$SAME_JAR" == true && "$SAME_NOTES" == true ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} 已存在且 jar/描述与仓库一致，跳过。"
          else
            echo "exists=refresh" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} 存在但 jar 或描述有更新，将删除重建。"
          fi

      - name: 删除旧 Release（仅刷新模式）
        if: steps.exists.outputs.exists == 'refresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          echo "旧 Release ${TAG} 已删除（--cleanup-tag 同步删除 tag 引用以便重新绑定）。"

      - name: 创建 Release 并上传模组 JAR
        if: steps.exists.outputs.exists == 'false' || steps.exists.outputs.exists == 'refresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${{ steps.tag.outputs.version }}"
          JAR="releases/drag-inventory-1.21.1-neoforge-${VER}.jar"
          NOTES="releases/RELEASE_NOTES-${TAG}.md"
          if [[ ! -f "$JAR" ]]; then
            echo "::error::未找到构建产物：${JAR}"
            exit 1
          fi
          if [[ -f "$NOTES" ]]; then
            NOTE_ARGS=(--notes-file "$NOTES")
          else
            NOTE_ARGS=(--notes "Drag Inventory ${VER} · Minecraft 1.21.1 · NeoForge 21.1.251")
          fi
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Drag Inventory ${VER}" \
            --latest \
            "${NOTE_ARGS[@]}"
          echo "Release ${TAG} 创建完成（target=$GITHUB_SHA），附件：${JAR}"

      - name: 推送发布标记 tag（release-<tag>）
        if: steps.exists.outputs.exists == 'false' || steps.exists.outputs.exists == 'refresh'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          MARKER="release-${TAG}"
          if [[ "${{ steps.exists.outputs.exists }}" == "refresh" ]]; then
            # 重发模式：旧标记指向旧提交，删除后重打到当前提交
            if git ls-remote --exit-code origin "refs/tags/${MARKER}" >/dev/null 2>&1; then
              git push origin ":refs/tags/${MARKER}" || true
            fi
            git tag -f "$MARKER"
            git push origin "$MARKER"
            echo "已重打标记 ${MARKER} → ${GITHUB_SHA}"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/${MARKER}" >/dev/null 2>&1; then
            echo "标记 ${MARKER} 已存在。"
          else
            git tag "$MARKER"
            git push origin "$MARKER"
            echo "已推送标记 ${MARKER}"
          fi
