plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = '2.9.5'
group = 'dev.draginventory'
base.archivesName = 'drag-inventory-1.21.1-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
repositories {
    mavenCentral()
    maven { url = 'https://maven.firstdark.dev/snapshots' }
}
neoForge {
    version = '21.1.251'
    runs {
        client {
            client()
            gameDirectory = file(providers.gradleProperty('weaponGameDir')
                    .orElse(providers.gradleProperty('switchSmoke').isPresent() ? 'run-switch-smoke'
                            : providers.gradleProperty('wheelSmoke').isPresent() ? 'run-wheel-smoke'
                            : providers.gradleProperty('markerSmoke').isPresent() ? 'run-marker-smoke' : 'run').get())
            systemProperty 'mixin.debug.export', 'true'
        }
    }
    mods { draginventory { sourceSet(sourceSets.main) } }
}

// 小内存沙箱适配（4GB 物理内存）：
// NFRT 的 NeoFormRuntimeTask 会把硬编码的 4G 堆转发给 vineflower 反编译器，
// 在 4GB 机器上直接 OOM（output.jar 0 字节）。压到 3200m + gradle daemon 512m
// 后全链可在沙箱内完成，对反编译结果与发布产物零影响（只是慢一点）。
tasks.withType(JavaExec).configureEach {
    if (name == 'createMinecraftArtifacts') {
        maxHeapSize = '2600m'
    }
}
dependencies {
    implementation 'com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.40:all'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
    from('LICENSE')
    from('TEMPLATE_LICENSE.txt')
}

// v2.7.1：mods.toml 版本改为模板占位，随 project.version 单源注入。此前硬编码
// 2.5.7 —— 2.6/2.7 两个版本的运行时元数据（mod 列表 / 崩溃报告 / 依赖解析）
// 一直是错的，用户实机崩溃报告里 draginventory@2.5.7 即此问题。
tasks.named('processResources', ProcessResources).configure {
    // Explicit input: the expand map inside filesMatching is not part of the
    // build-cache key on their own, so a warm cache can ship a jar whose
    // neoforge.mods.toml still carries the PREVIOUS version (hit on the
    // v2.9.2 -> v2.9.3 bump with org.gradle.caching=true).
    inputs.property('modVersion', project.version.toString())
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'modVersion': project.version.toString()
    }
}

// Optional isolated startup check; this class is absent from release builds.
if (providers.gradleProperty('smokeTest').isPresent()) {
    sourceSets.main.java.srcDir 'src/smoke/java'
}
if (providers.gradleProperty('hotbarSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/hotbarSmoke/java'
}
if (providers.gradleProperty('weaponSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/weaponSmoke/java'
}
if (providers.gradleProperty('markerSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/markerSmoke/java'
}
if (providers.gradleProperty('mapSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/mapSmoke/java'
}
if (providers.gradleProperty('wheelSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/wheelSmoke/java'
}
if (providers.gradleProperty('switchSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/switchSmoke/java'
}
if (providers.gradleProperty('soundprintSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/soundprintSmoke/java'
}
